[package]
name = "dar-al-hikayat-desktop"
version = "3.0.0"
description = "Dar Al-Hikayat desktop application"
authors = ["Dar Al-Hikayat"]
edition = "2021"

[lib]
name = "dar_al_hikayat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
