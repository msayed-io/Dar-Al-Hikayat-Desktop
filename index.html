<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>دَارُ الحِكَايَاتِ</title>
    <meta name="description" content="محرابٌ مقدس لفنانة السرد، صُمم بعناية فائقة ليحمي الإبداع من ضجيج العالم. يوفر 'دَارُ الحِكَايَاتِ' تجربة كتابة غامرة لا مثيل لها، مع مظاهر طباعية فاخرة. وتتجلى أثمن ميزاته في نظام الأذكار الهادئ، الذي يهدف إلى غرس السكينة الروحية في قلب العملية الإبداعية، ليصبح كل حرفٍ يُكتب ذكرًا." />
    <meta property="og:title" content="دَارُ الحِكَايَاتِ" />
    <meta property="og:description" content="محرابٌ مقدس لفنانة السرد، صُمم بعناية فائقة ليحمي الإبداع من ضجيج العالم. يوفر 'دَارُ الحِكَايَاتِ' تجربة كتابة غامرة لا مثيل لها، مع مظاهر طباعية فاخرة. وتتجلى أثمن ميزاته في نظام الأذكار الهادئ، الذي يهدف إلى غرس السكينة الروحية في قلب العملية الإبداعية، ليصبح كل حرفٍ يُكتب ذكرًا." />
    <meta name="format-detection" content="telephone=no" />
    <!-- خطوط ثمانية الرسمية لتطبيق دَارُ الحِكَايَاتِ (Thmanyah Official Fonts) -->
    <link rel="preload" href="/fonts/thmanyahsans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyahsans-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyahserifdisplay-Black.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyahserifdisplay-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyahseriftext-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyahseriftext-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/index.css" />
    <style>
      html, body, #root {
        font-family: 'Thmanyah Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #0F1617;
        min-height: 100%;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
      }
      /* منع التحديد والنسخ مع تفعيل الإدخال العادي */
      * { -webkit-user-select: none; -webkit-touch-callout: none; }
      textarea, input { -webkit-user-select: text !important; -webkit-touch-callout: default !important; }
    </style>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/dar-al-hikayat-logo-royal_classic.png" />
    <meta name="theme-color" content="#caa472" />
    <script type="module" src="/index.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Service Workers belong to the browser/PWA build, not the Tauri desktop shell.
      // Registering one on tauri.localhost can race the initial WebView navigation.
      const isTauriDesktop = window.location.hostname === 'tauri.localhost' ||
        window.location.protocol === 'asset:';
      if (!isTauriDesktop && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
